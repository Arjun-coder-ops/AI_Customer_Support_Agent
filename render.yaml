services:
  - type: web
    name: ai-support-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.8
      - key: MOCK_LLM
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
