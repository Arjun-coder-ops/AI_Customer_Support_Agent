<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support Agent</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; max-width: 100%; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .header { background: #232f3e; color: #fff; padding: 15px; text-align: center; font-weight: bold; }
        .messages { flex-grow: 1; height: 400px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #e3f2fd; color: #000; }
        .message.agent { align-self: flex-start; background: #f1f3f4; color: #000; }
        .message.error { background: #ffebee; color: #c62828; align-self: flex-start; font-size: 0.9em; }
        .debug-info { font-size: 0.75em; color: #666; margin-top: 5px; border-top: 1px solid #ccc; padding-top: 5px; }
        .input-area { display: flex; border-top: 1px solid #ddd; }
        .input-area input { flex-grow: 1; padding: 15px; border: none; outline: none; font-size: 16px; }
        .input-area button { padding: 15px 20px; border: none; background: #ff9900; color: #fff; font-weight: bold; cursor: pointer; }
        .input-area button:hover { background: #e38800; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">AmazonHelp AI Agent</div>
    <div class="messages" id="messages">
        <div class="message agent">Hi! I am the AI Customer Support Agent. How can I help you today?</div>
    </div>
    <form class="input-area" id="chat-form">
        <input type="text" id="user-input" placeholder="Type a message..." required autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
    </form>
</div>

<script>
    // In production (Vercel), this will be replaced via build step or we can just fetch relatively if they share a domain.
    // However, Render (API) and Vercel (Frontend) will have different domains.
    // We configure Vercel to proxy /api to the Render backend in vercel.json.
    const API_URL = '/api/chat';

    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, sender, debugData = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.textContent = text;
        
        if (debugData) {
            const debugDiv = document.createElement('div');
            debugDiv.className = 'debug-info';
            debugDiv.innerHTML = `<strong>Intent:</strong> ${debugData.intent.name} (${(debugData.intent.confidence * 100).toFixed(1)}%)<br>
                                  <strong>Escalation:</strong> ${debugData.escalation.decision}<br>
                                  <strong>Retrieval:</strong> ${debugData.retrieval.retrieved_count} cases`;
            msgDiv.appendChild(debugDiv);
        }

        messages.appendChild(msgDiv);
        messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';
        sendBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();
            
            let replyText = "Sorry, I couldn't generate a reply.";
            if (data.generated_reply && data.generated_reply.reply) {
                replyText = data.generated_reply.reply;
            } else if (data.escalation && data.escalation.decision === 'ESCALATE') {
                replyText = "I need to escalate this to a human agent. Please hold.";
            }

            appendMessage(replyText, 'agent', data);

        } catch (error) {
            console.error(error);
            appendMessage("Connection error to backend. Ensure API is running.", 'error');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    });
</script>

</body>
</html>
